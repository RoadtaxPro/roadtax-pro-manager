kind = "web"
previewPath = "/"
title = "RPMS | Roadtax Pro Management System"
description = "RPMS (Roadtax Pro Management System) is an English-language management system for a Malaysian vehicle insurance and road tax service. It uses fictional prototype data for customer, vehicle, renewal, quotation, invoice, finance, and team workflows. Customer changes and CSV imports are session-only; team roles are descriptive previews with no enforced access restrictions, authentication, database, or insurer integration."
version = "1.0.0"
id = "artifacts/prbms"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23821

[services.development]
run = "pnpm --filter @workspace/prbms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prbms", "run", "build" ]
serve = "static"
publicDir = "artifacts/prbms/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23821"
BASE_PATH = "/"
