kind = "web"
previewPath = "/"
title = "PRBMS | Roadtax Pro"
description = "An English-language management system for Roadtax Pro, a Malaysian vehicle insurance and road tax service. It uses fictional prototype data for customers, vehicles, renewals, quotations, invoices, finance, reports, and staff roles. Records and CSV imports are kept only in the current demo session; there is no database, authentication, or insurer integration."
version = "1.0.0"
id = "artifacts/prbms"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23821

[services.development]
run = "pnpm --filter @workspace/prbms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prbms", "run", "build" ]
serve = "static"
publicDir = "artifacts/prbms/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23821"
BASE_PATH = "/"
